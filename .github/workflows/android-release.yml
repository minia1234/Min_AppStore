name: Build signed Android release draft
on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: Increasing Android versionCode
        required: true
      versionName:
        description: Human readable version
        required: true
      tag:
        description: New GitHub release tag (for example v0.1.0)
        required: true
permissions:
  contents: write
concurrency:
  group: minappstore-android-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ inputs.versionCode }}
      VERSION_NAME: ${{ inputs.versionName }}
      RELEASE_TAG: ${{ inputs.tag }}
      STORE_KEYSTORE_PATH: ${{ github.workspace }}/release-key.jks
      STORE_KEYSTORE_PASSWORD: ${{ secrets.STORE_KEYSTORE_PASSWORD }}
      STORE_KEY_ALIAS: ${{ secrets.STORE_KEY_ALIAS }}
      STORE_KEY_PASSWORD: ${{ secrets.STORE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v3
      - name: Validate release inputs and restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.STORE_KEYSTORE_BASE64 }}
        run: |
          python - <<'PY'
          import base64, os, pathlib, re
          assert os.environ['VERSION_CODE'].isdigit() and 0 < int(os.environ['VERSION_CODE']) <= 2100000000, 'Invalid versionCode'
          assert re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._+-]{0,79}',os.environ['VERSION_NAME']), 'Invalid versionName'
          assert re.fullmatch(r'v?[A-Za-z0-9][A-Za-z0-9._-]{0,79}',os.environ['RELEASE_TAG']), 'Invalid release tag'
          for name in ('STORE_KEYSTORE_PASSWORD','STORE_KEY_ALIAS','STORE_KEY_PASSWORD','KEYSTORE_BASE64'):
              assert os.environ[name], f'Missing signing secret: {name}'
          key=pathlib.Path(os.environ['STORE_KEYSTORE_PATH'])
          key.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'],validate=True))
          key.chmod(0o600)
          PY
      - name: Build and check signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleRelease -PstoreVersionCode="$VERSION_CODE" -PstoreVersionName="$VERSION_NAME"
      - name: Generate manifest from the actual signed APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/MinAppStore.apk
          python scripts/store_manifest.py --apk release/MinAppStore.apk --metadata scripts/store-metadata.json --output release/store-manifest.json
      - name: Keep a reviewable release artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinAppStore-signed-release
          path: release/
      - name: Create GitHub release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" release/MinAppStore.apk release/store-manifest.json --draft --title "MinAppStore $VERSION_NAME" --generate-notes --target "$GITHUB_SHA"
      - name: Remove runner signing key
        if: always()
        run: rm -f -- "$STORE_KEYSTORE_PATH"
