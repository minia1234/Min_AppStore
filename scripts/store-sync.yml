# Copy to AIProject-k/ApplicationTest/.github/workflows/store-sync.yml (replaces the old one; scripts/sync_catalog.py there is then unused).
# Every run checks out the latest scripts/ from the private source repository, so pushing to main updates the sync without copying files.
name: Synchronize MinAppStore for free
on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: minappstore-catalog-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: minia1234/Min_AppStore
          ref: main
          # Read-only deploy key of the private source repository, never a personal account token.
          ssh-key: ${{ secrets.MINAPPSTORE_SOURCE_KEY }}
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - run: python scripts/sync_free.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STORE_ORIGIN: ${{ vars.STORE_ORIGIN }}
          MINAPPSTORE_ADMIN_TOKEN: ${{ secrets.MINAPPSTORE_ADMIN_TOKEN }}
